<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Request Failed</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffebee, #fce4ec);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }

    .container {
      background-color: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
      color: #c62828;
    }

    .spinner {
      border: 6px solid #fddede;
      border-top: 6px solid #c62828;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }

    .message {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .description {
      font-size: 16px;
      color: #444;
    }

    .small {
      margin-top: 15px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner" aria-hidden="true"></div>

    <div id="error-content" class="hidden">
      <div class="icon">❌</div>
      <div class="message">Request Failed</div>
      <div class="description">We're sorry, something went wrong while processing your request.</div>
      <div class="small">Please try again later.</div>
    </div>
  </div>

  <script>
    // Show error content after 4 seconds
    setTimeout(function () {
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('error-content').classList.remove('hidden');
    }, 4000);
  </script>
</body>
</html>
